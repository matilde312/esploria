
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ESPLORIA - SCEGLI IL TUO COMPAGNO</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap');

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: 'Patrick Hand', cursive;
  background: #f6ead3;
  color: #302d35;
}

button, input {
  font: inherit;
}

/* GALLERIA DEGLI ANIMALI */

#viewport {
  width: 100%;
  height: 100dvh;
  overflow: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}

#viewport::-webkit-scrollbar {
  display: none;
}

#scene {
  position: relative;
  width: max(100vw, 177.68dvh);
  aspect-ratio: 1672 / 941;
}

#landscape {
  display: block;
  width: 100%;
  height: 100%;
  user-select: none;
  -webkit-user-drag: none;
}

#animals {
  position: absolute;
  inset: 0;
}

.animal, #back {
  position: absolute;
  border: 0;
  background: transparent;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.animal {
  border-radius: 15px;
}

#back {
  z-index: 5;
  left: 3%;
  top: 2%;
  width: 17%;
  height: 12%;
  border-radius: 20px;
}

/* SCHERMATE ILLUSTRATE */

.overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 20;
  background: rgba(18, 35, 48, 0.82);
  align-items: center;
  justify-content: center;
  padding: 8px;
