
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ESPLORIA - BORGO DEGLI INGRANAGGI</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap');

/* IMPOSTAZIONI GENERALI */

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
}

body {
  font-family: 'Patrick Hand', cursive;
  color: #26394b;
  background: #eee4d3;
}

button, a {
  font-family: inherit;
}

/* INTESTAZIONE DEL BORGO */

.header {
  position: relative;
  width: 100%;
}

.header img {
  display: block;
  width: 100%;
  height: auto;
}

/* TORNA ALLA MAPPA
   PULSANTE GIÀ DISEGNATO NELL'IMMAGINE */

.back {
  position: absolute;
  left: 2%;
  top: 4%;
  width: 17%;
  height: 23%;

  background: transparent;
  border: none;
  border-radius: 18px;
  cursor: pointer;
}

.back:focus-visible {
  outline: 3px solid #d87850;
}

/* SEZIONE DELLE ATTIVITÀ */

.activities {
  min-height: 65vh;
  padding: 5px 20px 100px;

  background-image:
    linear-gradient(
      rgba(244, 238, 224, 0.28),
      rgba(244, 238, 224, 0.28)
    ),
    url("pavimento-borgo.png");

  background-repeat: repeat;
  background-size: 500px auto;
}

/* GRIGLIA DELLE ATTIVITÀ */

.activity-grid {
  width: min(1400px, 100%);
  margin: 0 auto;

  display: grid;
  grid-template-columns:
    repeat(
      auto-fit,
      minmax(min(100%, 560px), 1fr)
    );

  gap: 30px;
  justify-content: center;
}

/* CORNICE DELLA SCHEDA */

.activity-card {
  position: relative;
  width: 100%;
  max-width: 950px;
  aspect-ratio: 3 / 2;
  margin: 0 auto;
}

/* UNA SOLA ATTIVITÀ:
   CORNICE PIÙ GRANDE */

.activity-card:only-child {
  width: min(75vw, 950px);
}

.card-frame {
  position: absolute;
  inset: 0;

  width: 100%;
  height: 100%;

  object-fit: fill;
  pointer-events: none;
}

/* CONTENUTO DELLA CORNICE */

.card-content {
  position: absolute;
  z-index: 1;

  left: 9%;
  right: 9%;
  top: 22%;
  bottom: 12%;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  text-align: center;
  gap: 10px;
}

/* IMMAGINE DEL GIOCO */

.game-preview {
  width: 48%;
  max-height: 42%;
  object-fit: contain;
}

/* TITOLO DEL GIOCO */

.game-title {
  margin: 0;

  font-size: clamp(26px, 3vw, 42px);
  font-weight: 400;
  line-height: 1.1;

  text-transform: uppercase;
}

/* DESCRIZIONE */

.game-description {
  margin: 0;

  font-size: clamp(19px, 2vw, 28px);
  line-height: 1.2;

  text-transform: uppercase;
}

/* PULSANTE GIOCA */

.play-button {
  margin-top: 10px;
  padding: 7px 38px;

  border: 2px solid #aa593d;
  border-radius: 30px;

  background: #d87850;
  color: #ffffff;

  font-family: 'Patrick Hand', cursive;
  font-size: clamp(24px, 2.5vw, 32px);
  font-weight: 400;
  line-height: 1.2;

  cursor: pointer;
  box-shadow: 0 3px 0 #a65c42;
}

.play-button:hover {
  background: #c96a44;
}

.play-button:focus-visible {
  outline: 3px solid #26394b;
  outline-offset: 3px;
}

/* FINESTRA PROVVISORIA */

#overlay {
  position: fixed;
  inset: 0;
  z-index: 20;

  display: none;
  align-items: center;
  justify-content: center;

  padding: 20px;
  background: rgba(24, 42, 57, 0.55);
}

#overlay.open {
  display: flex;
}

.dialog {
  width: min(430px, 100%);
  padding: 28px;

  background: #fff0d2;
  border: 4px solid #a77b4e;
  border-radius: 22px;

  text-align: center;
}

.dialog h2 {
  margin: 0 0 12px;
  font-size: 32px;
  font-weight: 400;
}

.dialog p {
  font-size: 23px;
  line-height: 1.25;
}

.dialog button {
  background: #d87850;
  color: white;

  border: none;
  border-radius: 15px;

  padding: 10px 25px;

  font-family: 'Patrick Hand', cursive;
  font-size: 23px;

  cursor: pointer;
}

/* ADATTAMENTO TABLET E TELEFONI */

@media (max-width: 700px) {

  .activities {
    padding: 10px 10px 70px;
    background-size: 350px auto;
  }

  .activity-grid {
    grid-template-columns: 1fr;
    gap: 20px;
  }

  .activity-card,
  .activity-card:only-child {
    width: 100%;
    max-width: 600px;
  }

  .card-content {
    top: 20%;
    bottom: 10%;
    gap: 4px;
  }

  .game-preview {
    max-height: 35%;
  }

  .game-title {
    font-size: clamp(19px, 4.5vw, 28px);
  }

  .game-description {
    font-size: clamp(13px, 3vw, 19px);
  }

  .play-button {
    margin-top: 4px;
    padding: 4px 25px;
    font-size: clamp(19px, 4vw, 25px);
  }

}
</style>
</head>

<body>

<!-- INTESTAZIONE DEL BORGO -->

<header class="header">

  <img
    src="testata-borgo.png"
    alt="BORGO DEGLI INGRANAGGI"
  >

  <a
    class="back"
    href="mondo.html"
    aria-label="TORNA ALLA MAPPA"
  ></a>

</header>

<!-- SEZIONE DELLE ATTIVITÀ -->

<main class="activities">

  <div class="activity-grid">

    <!-- PRIMA ATTIVITÀ -->

    <article class="activity-card">

      <img
        class="card-frame"
        src="cornice-borgo.png"
        alt=""
      >

      <div class="card-content">

        <!-- ANTEPRIMA DEL GIOCO -->

        <img
          class="game-preview"
          src="anteprima-forziere.png"
          alt=""
          onerror="this.style.display='none'"
        >

        <!-- TITOLO -->

        <h2 class="game-title">
          IL FORZIERE SEGRETO
        </h2>

        <!-- DESCRIZIONE -->

        <p class="game-description">
          SCOPRI IL CODICE NASCOSTO
          E APRI IL FORZIERE!
        </p>

        <!-- PULSANTE -->

        <button
          class="play-button"
          type="button"
          onclick="openGame()"
        >
          GIOCA →
        </button>

      </div>

    </article>

    <!--
      QUI AGGIUNGEREMO
      LE PROSSIME ATTIVITÀ
    -->

  </div>

</main>

<!-- FINESTRA PROVVISORIA DEL GIOCO -->

<div
  id="overlay"
  role="dialog"
  aria-modal="true"
  aria-labelledby="dialogTitle"
>

  <div class="dialog">

    <h2 id="dialogTitle">
      IL FORZIERE SEGRETO
    </h2>

    <p>
      QUESTA AVVENTURA
      ARRIVERÀ PRESTO!
    </p>

    <button
      type="button"
      onclick="closeGame()"
    >
      TORNA AL BORGO
    </button>

  </div>

</div>

<script>

/* APERTURA DEL GIOCO */

const overlay = document.getElementById("overlay");

function openGame() {
  overlay.classList.add("open");
  overlay.querySelector("button").focus();
}

/* CHIUSURA DELLA FINESTRA */

function closeGame() {
  overlay.classList.remove("open");
  document.querySelector(".play-button").focus();
}

/* CHIUSURA CON ESC */

document.addEventListener("keydown", function(event) {
  if (
    event.key === "Escape" &&
    overlay.classList.contains("open")
  ) {
    closeGame();
  }
});

/* CHIUSURA CLICCANDO FUORI */

overlay.addEventListener("click", function(event) {
  if (event.target === overlay) {
    closeGame();
  }
});

</script>

</body>
</html>
