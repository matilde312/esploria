
<!DOCTYPE html>
<html lang="it">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ESPLORIA - INIZIA L'AVVENTURA</title>

<style>

/* IMPOSTAZIONI GENERALI */

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: #dce9e0;
}

/* FINESTRA PRINCIPALE */

#viewport {
  width: 100%;
  height: 100vh;
  height: 100dvh;

  overflow-x: auto;
  overflow-y: auto;

  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;

  scrollbar-width: none;
}

#viewport::-webkit-scrollbar {
  display: none;
}

/* PAESAGGIO ADATTIVO */

#scene {
  position: relative;

  width: max(100vw, 177.78dvh);
  aspect-ratio: 16 / 9;

  overflow: hidden;
}

/* IMMAGINE DI SFONDO */

#landscape {
  display: block;
  width: 100%;
  height: 100%;

  object-fit: fill;

  user-select: none;
  -webkit-user-drag: none;
}

/* PULSANTI INVISIBILI */

.hotspot {
  position: absolute;
  display: block;

  border: none;
  background: transparent;

  cursor: pointer;
  text-decoration: none;

  -webkit-tap-highlight-color: transparent;
}

.hotspot:hover,
.hotspot:active {
  background: transparent;
  box-shadow: none;
  filter: none;
}

.hotspot:focus-visible {
  outline: 3px solid white;
  outline-offset: 4px;
}

/* INIZIA L'AVVENTURA */

#start {
  left: 36%;
  top: 45%;
  width: 29%;
  height: 12%;
}

/* AREA INSEGNANTI */

#teacher {
  left: 84%;
  top: 2%;
  width: 14%;
  height: 10%;
}

/* SMARTPHONE */

@media (max-width: 600px) {

  #scene {
    width: max(100vw, 160dvh);
  }

}

</style>
</head>

<body>

<!-- HOMEPAGE -->

<main id="viewport">

  <div id="scene">

    <img
      id="landscape"
      src="sfondo-esploria.png"
      alt="ESPLORIA, UN MONDO DI GIOCHI, SCOPERTE E AVVENTURE"
      draggable="false"
    >

    <!-- INIZIA L'AVVENTURA -->

    <a
      id="start"
      class="hotspot"
      href="accesso.html"
      aria-label="INIZIA L'AVVENTURA"
    ></a>

    <!-- AREA INSEGNANTI -->

    <a
      id="teacher"
      class="hotspot"
      href="insegnanti.html"
      aria-label="AREA INSEGNANTI"
    ></a>

  </div>

</main>

<script>

const viewport = document.getElementById("viewport");
const scene = document.getElementById("scene");


/* CENTRA IL PAESAGGIO */

function centerLandscape() {

  viewport.scrollLeft = Math.max(
    0,
    (scene.scrollWidth - viewport.clientWidth) / 2
  );

  viewport.scrollTop = Math.max(
    0,
    (scene.scrollHeight - viewport.clientHeight) / 2
  );

}

window.addEventListener("load", centerLandscape);

/* MANTIENE LA POSIZIONE AL RIDIMENSIONAMENTO */

let previousWidth = window.innerWidth;
let previousHeight = window.innerHeight;

window.addEventListener("resize", function() {

  const oldScrollableWidth = Math.max(
    0,
    scene.scrollWidth - previousWidth
  );

  const oldScrollableHeight = Math.max(
    0,
    scene.scrollHeight - previousHeight
  );

  const horizontalProgress = oldScrollableWidth > 0
    ? viewport.scrollLeft / oldScrollableWidth
    : 0.5;

  const verticalProgress = oldScrollableHeight > 0
    ? viewport.scrollTop / oldScrollableHeight
    : 0.5;

  const newScrollableWidth = Math.max(
    0,
    scene.scrollWidth - viewport.clientWidth
  );

  const newScrollableHeight = Math.max(
    0,
    scene.scrollHeight - viewport.clientHeight
  );

  viewport.scrollLeft =
    newScrollableWidth * horizontalProgress;

  viewport.scrollTop =
    newScrollableHeight * verticalProgress;

  previousWidth = window.innerWidth;
  previousHeight = window.innerHeight;

});

</script>

</body>
</html>
