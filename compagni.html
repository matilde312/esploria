
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESPLORIA - SCEGLI IL TUO COMPAGNO</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: #f6ead3;
  color: #243d4b;
}

button { font: inherit; }

#viewport {
  width: 100%;
  height: 100dvh;
  overflow: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}

#viewport::-webkit-scrollbar { display: none; }

#scene {
  position: relative;
  width: max(100vw, 177.68dvh);
  aspect-ratio: 1672 / 941;
}

#landscape {
  display: block;
  width: 100%;
  height: 100%;
  user-select: none;
  -webkit-user-drag: none;
}

#animals {
  position: absolute;
  inset: 0;
}

.animal, #back {
  position: absolute;
  border: 0;
  background: transparent;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.animal {
  border-radius: 15px;
}

.animal:focus-visible,
#back:focus-visible,
.hotspot:focus-visible {
  outline: 3px solid #b66c3d;
  outline-offset: -3px;
}

#back {
  z-index: 5;
  left: 2%;
  top: 1.5%;
  width: 18%;
  height: 13%;
  border-radius: 20px;
}

/* SCHEDA ILLUSTRATA */

#overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 20;
  background: rgba(18, 35, 48, 0.82);
  align-items: center;
  justify-content: center;
  padding: 8px;
}

#overlay.open { display: flex; }

#cardViewport {
  position: relative;
  width: min(100%, 150dvh);
  max-height: calc(100dvh - 16px);
  aspect-ratio: 3 / 2;
}

#cardImage {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  user-select: none;
  -webkit-user-drag: none;
}

.hotspot {
  position: absolute;
  border: 0;
  background: transparent;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

/* POSIZIONI DEI PULSANTI NELLE SCHEDE */

#closeCard {
  top: 3%;
  right: 7%;
  width: 7%;
  height: 13%;
  border-radius: 50%;
}

#returnAnimals {
  left: 11%;
  bottom: 5%;
  width: 28%;
  height: 16%;
  border-radius: 30px;
}

#chooseCompanion {
  left: 43%;
  bottom: 4%;
  width: 41%;
  height: 19%;
  border-radius: 30px;
}

/* SCHERMATE SUCCESSIVE */

#dialogOverlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 30;
  background: rgba(18, 35, 48, 0.82);
  align-items: center;
  justify-content: center;
  padding: 16px;
}

#dialogOverlay.open { display: flex; }

#panel {
  width: min(440px, 100%);
  max-height: 90dvh;
  overflow-y: auto;
  padding: 25px;
  background: #fff7e8;
  border: 3px solid #9d754d;
  border-radius: 22px;
  text-align: center;
  box-shadow: 0 15px 45px #0005;
}

#panel h2 {
  margin: 4px 0 15px;
  font-size: 24px;
}

#panel p {
  line-height: 1.6;
}

#nameInput {
  width: 100%;
  padding: 13px;
  border: 2px solid #bda381;
  border-radius: 12px;
  font-size: 18px;
  text-align: center;
  text-transform: uppercase;
}

.action {
  display: block;
  width: 100%;
  margin-top: 12px;
  padding: 14px 10px;
  border: 0;
  border-radius: 12px;
  background: #c66e50;
  color: white;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
}

.action.secondary {
  background: #e9d9bc;
  color: #243d4b;
}

#naming, #finished { display: none; }

@media (max-width: 600px) {
  #scene {
    width: max(100vw, 165dvh);
  }
}
</style>
</head>

<body>

<main id="viewport">
  <div id="scene">

    <img
      id="landscape"
      src="compagni-esploria.png"
      alt="SCEGLI IL TUO COMPAGNO DI AVVENTURA TRA 28 ANIMALI"
      draggable="false"
    >

    <div id="animals"></div>

    <a
      id="back"
      href="accesso.html"
      aria-label="TORNA INDIETRO"
      title="TORNA INDIETRO"
    ></a>

  </div>
</main>

<!-- SCHEDA ILLUSTRATA DELL'ANIMALE -->

<div id="overlay" role="dialog"
     aria-modal="true"
     aria-label="SCHEDA DEL COMPAGNO">

  <div id="cardViewport">

    <img id="cardImage" src="" alt="">

    <button
      id="closeCard"
      class="hotspot"
      type="button"
      aria-label="CHIUDI LA SCHEDA"
    ></button>

    <button
      id="returnAnimals"
      class="hotspot"
      type="button"
      aria-label="TORNA AGLI ANIMALI"
    ></button>

    <button
      id="chooseCompanion"
      class="hotspot"
      type="button"
      aria-label="SCEGLI QUESTO COMPAGNO"
    ></button>

  </div>
</div>

<!-- SCELTA DEL NOME -->

<div id="dialogOverlay" role="dialog"
     aria-modal="true"
     aria-label="DAI UN NOME AL COMPAGNO">

  <div id="panel">

    <section id="naming">
      <h2>COME VUOI CHIAMARLO?</h2>

      <p>OGNI COMPAGNO HA BISOGNO DI UN NOME SPECIALE!</p>

      <input
        id="nameInput"
        type="text"
        maxlength="20"
        placeholder="SCRIVI IL NOME"
        aria-label="NOME DEL COMPAGNO"
        autocomplete="off"
      >

      <button class="action" id="confirm">
        CONFERMA
      </button>

      <button class="action secondary" id="goBack">
        TORNA INDIETRO
      </button>
    </section>

    <section id="finished">
      <h2>CHE BELLA SCELTA!</h2>
      <p id="result"></p>

      <button class="action" id="finish">
        CONTINUA L'AVVENTURA
      </button>

      <button class="action secondary" id="restart">
        SCEGLI UN ALTRO COMPAGNO
      </button>
    </section>

  </div>
</div>

<script>

/* ELENCO DEI 28 COMPAGNI */

const companions = [
  ["VOLPE", "volpe"],
  ["LUPO", "lupo"],
  ["CERVO", "cervo"],
  ["GUFO", "gufo"],
  ["CONIGLIO", "coniglio"],
  ["SCOIATTOLO", "scoiattolo"],
  ["PROCIONE", "procione"],

  ["ORSO", "orso"],
  ["TASSO", "tasso"],
  ["LONTRA", "lontra"],
  ["RICCIO", "riccio"],
  ["CASTORO", "castoro"],
  ["LINCE", "lince"],
  ["GATTO SELVATICO", "gatto-selvatico"],

  ["DRAGHETTO", "draghetto"],
  ["TARTARUGA", "tartaruga"],
  ["AQUILA", "aquila"],
  ["CORVO", "corvo"],
  ["FALCO", "falco"],
  ["CINGHIALE", "cinghiale"],
  ["CAPRIOLO", "capriolo"],

  ["DELFINO", "delfino"],
  ["FOCA", "foca"],
  ["PANDA", "panda"],
  ["PANDA ROSSO", "panda-rosso"],
  ["PINGUINO", "pinguino"],
  ["ORSO POLARE", "orso-polare"],
  ["VOLPE ARTICA", "volpe-artica"]
];

const viewport = document.getElementById("viewport");
const scene = document.getElementById("scene");
const animals = document.getElementById("animals");

const overlay = document.getElementById("overlay");
const cardImage = document.getElementById("cardImage");

const dialogOverlay = document.getElementById("dialogOverlay");
const naming = document.getElementById("naming");
const finished = document.getElementById("finished");

const nameInput = document.getElementById("nameInput");

let selected = -1;

/* CREA LE AREE CLICCABILI SULLA GALLERIA */

const centersX = [9.5, 23.1, 36.5, 50, 63.5, 77, 90.5];
const tops = [15, 39, 59, 79];
const heights = [23, 19, 19, 20];

companions.forEach((animal, index) => {
  const column = index % 7;
  const row = Math.floor(index / 7);

  const button = document.createElement("button");
  button.className = "animal";
  button.type = "button";

  button.setAttribute(
    "aria-label",
    "SCOPRI " + animal[0]
  );

  button.style.left = (centersX[column] - 6.5) + "%";
  button.style.top = tops[row] + "%";
  button.style.width = "13%";
  button.style.height = heights[row] + "%";

  button.addEventListener("click", () => {
    showAnimal(index);
  });

  animals.appendChild(button);
});

/* APRE LA SCHEDA ILLUSTRATA */

function showAnimal(index) {
  selected = index;

  const animal = companions[index];

  cardImage.src =
    "schede/scheda-" + animal[1] + ".png";

  cardImage.alt =
    "SCHEDA DEL COMPAGNO " + animal[0];

  overlay.classList.add("open");
  document.getElementById("closeCard").focus();
}

/* CHIUDE LA SCHEDA */

function closeCard() {
  overlay.classList.remove("open");
}

document.getElementById("closeCard").onclick = closeCard;

document.getElementById("returnAnimals").onclick = closeCard;

/* CONFERMA LA SCELTA E CHIEDE IL NOME */

document.getElementById("chooseCompanion").onclick = () => {
  if (selected < 0) return;

  closeCard();

  naming.style.display = "block";
  finished.style.display = "none";

  nameInput.value = "";

  dialogOverlay.classList.add("open");
  nameInput.focus();
};

/* CONFERMA IL NOME */

function confirmName() {
  if (selected < 0) return;

  const name = nameInput.value.trim().toUpperCase();

  if (!name) {
    alert("SCRIVI PRIMA IL NOME DEL TUO COMPAGNO!");
    nameInput.focus();
    return;
  }

  const companion = {
    animal: companions[selected][0],
    index: selected,
    name: name
  };

  /* SALVATAGGIO LOCALE DI PROVA */

  try {
    localStorage.setItem(
      "esploria-compagno-prova",
      JSON.stringify(companion)
    );
  } catch (error) {
    console.warn("SALVATAGGIO LOCALE NON DISPONIBILE", error);
  }

  document.getElementById("result").textContent =
    name + " È IL TUO NUOVO COMPAGNO DI AVVENTURA!";

  naming.style.display = "none";
  finished.style.display = "block";
}

document.getElementById("confirm").onclick = confirmName;

nameInput.addEventListener("keydown", event => {
  if (event.key === "Enter") confirmName();
});

/* TORNA ALLA SCHEDA */

document.getElementById("goBack").onclick = () => {
  dialogOverlay.classList.remove("open");
  overlay.classList.add("open");
};

/* CAMBIA COMPAGNO */

document.getElementById("restart").onclick = () => {
  dialogOverlay.classList.remove("open");
  closeCard();
  selected = -1;
};

/* PROSEGUI: PAGINA FUTURA ANCORA DA CREARE */

document.getElementById("finish").onclick = () => {
  alert("PRESTO POTRAI ENTRARE NEL MONDO DI ESPLORIA!");
  dialogOverlay.classList.remove("open");
};

/* CHIUSURA CON ESC */

document.addEventListener("keydown", event => {
  if (event.key !== "Escape") return;

  if (dialogOverlay.classList.contains("open")) {
    dialogOverlay.classList.remove("open");
  } else {
    closeCard();
  }
});

/* CENTRAMENTO DEL PAESAGGIO */

function centerScene() {
  viewport.scrollLeft = Math.max(
    0,
    (scene.scrollWidth - viewport.clientWidth) / 2
  );

  viewport.scrollTop = Math.max(
    0,
    (scene.scrollHeight - viewport.clientHeight) / 2
  );
}

window.addEventListener("load", centerScene);
window.addEventListener("resize", centerScene);

</script>
</body>
</html>
