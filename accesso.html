<style>

/* IMPOSTAZIONI GENERALI */

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #e7e8d9;
  font-family: "Patrick Hand", cursive;
  color: #243d4b;
}

/* PAESAGGIO ADATTIVO */

#viewport {
  width: 100%;
  height: 100vh;
  height: 100dvh;
  overflow-x: auto;
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}

#viewport::-webkit-scrollbar {
  display: none;
}

#scene {
  position: relative;
  width: max(100vw, 177.78dvh);
  aspect-ratio: 16 / 9;
  overflow: hidden;
}

#landscape {
  display: block;
  width: 100%;
  height: 100%;
  user-select: none;
  -webkit-user-drag: none;
}

/* AREE CLICCABILI INVISIBILI */

.hotspot {
  position: absolute;
  display: block;
  background: transparent;
  border: 0;
  padding: 0;
  cursor: pointer;
  text-decoration: none;
  -webkit-tap-highlight-color: transparent;
}

.hotspot:focus-visible {
  outline: 3px solid #243d4b;
  outline-offset: 3px;
}

/* TORNA INDIETRO */

#back {
  left: 2%;
  top: 3%;
  width: 16%;
  height: 11%;
}
