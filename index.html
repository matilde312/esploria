<!DOCTYPE html>
<html lang="it">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Esploria - Inizia l'avventura</title>

<style>

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: #dce9e0;
}

/* FINESTRA CHE PERMETTE DI SCORRERE CON IL TRACKPAD */

#viewport {
  width: 100%;
  height: 100vh;
  height: 100dvh;

  overflow-x: auto;
  overflow-y: auto;

  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
}

/* SCENA: NON SI RIMPICCIOLISCE SOTTO 1536 PIXEL */

#scene {
  position: relative;

  width: max(100%, 1536px);
  aspect-ratio: 1536 / 1024;

  overflow: hidden;
}

/* IMMAGINE ORIGINALE */

#landscape {
  display: block;
  width: 100%;
  height: 100%;

  user-select: none;
  -webkit-user-drag: none;
}

/* AREE CLICCABILI INVISIBILI */

.hotspot {
  position: absolute;
  display: block;

  background: transparent;
  border: 0;
  outline: none;

  cursor: pointer;

  -webkit-tap-highlight-color: transparent;
}

/* NESSUNA ILLUMINAZIONE O BORDO AL PASSAGGIO */

.hotspot:hover,
.hotspot:active {
  background: transparent;
  box-shadow: none;
  filter: none;
}

/* CONTORNO SOLO PER NAVIGAZIONE CON TASTIERA */

.hotspot:focus-visible {
  outline: 3px solid #ffffff;
  outline-offset: 3px;
}

/* INIZIA L'AVVENTURA */

#start {
  left: 34%;
  top: 40%;
  width: 33%;
  height: 11%;
}

/* RITROVA IL TUO PERSONAGGIO */

#recover {
  left: 36%;
  top: 51%;
  width: 29%;
  height: 9%;
}

/* AREA INSEGNANTI */

#teacher {
  left: 83%;
  top: 1%;
  width: 16%;
  height: 10%;
}

/* FINESTRA INFORMATIVA */

#notice {
  position: fixed;
  inset: 0;

  display: none;
  align-items: center;
  justify-content: center;

  padding: 20px;

  background: rgba(22, 39, 45, 0.75);
  z-index: 100;
}

#notice.open {
  display: flex;
}

.card {
  width: min(420px, 100%);
  padding: 30px;

  background: #fff8e7;
  border: 3px solid #775b3e;
  border-radius: 22px;

  text-align: center;
  color: #263b44;

  box-shadow: 0 12px 35px rgba(0,0,0,0.3);
}

.card h2 {
  margin-top: 0;
  font-size: 26px;
}

.card p {
  font-size: 18px;
  line-height: 1.5;
}

.card button {
  padding: 13px 30px;

  background: #c66e50;
  color: white;

  border: none;
  border-radius: 12px;

  font-size: 17px;
  font-weight: bold;

  cursor: pointer;
}

.card button:hover {
  background: #a9543a;
}

</style>
</head>

<body>

<main id="viewport">

  <div id="scene">

    <img
      id="landscape"
      src="sfondo-esploria.png"
      alt="Esploria, un mondo fantastico da esplorare"
      draggable="false"
    >

    <a
      id="start"
      class="hotspot"
      href="#inizia"
      aria-label="Inizia l'avventura"
      data-message="Presto potrai creare il tuo personaggio e iniziare a esplorare Esploria!"
    ></a>

    <a
      id="recover"
      class="hotspot"
      href="#ritrova"
      aria-label="Ritrova il tuo personaggio"
      data-message="Qui potrai ritrovare il tuo personaggio e continuare la tua avventura."
    ></a>

    <a
      id="teacher"
      class="hotspot"
      href="#insegnanti"
      aria-label="Area insegnanti"
      data-message="Qui realizzeremo l'area riservata agli insegnanti."
    ></a>

  </div>

</main>

<div
  id="notice"
  role="dialog"
  aria-modal="true"
  aria-labelledby="notice-title"
>

  <div class="card">

    <h2 id="notice-title">
      Esploria è in costruzione 🌿
    </h2>

    <p id="notice-text"></p>

    <button id="close" type="button">
      CHIUDI
    </button>

  </div>

</div>

<script>

const viewport = document.getElementById("viewport");
const scene = document.getElementById("scene");

const notice = document.getElementById("notice");
const noticeText = document.getElementById("notice-text");
const closeButton = document.getElementById("close");

/* ALL'APERTURA MOSTRA IL CENTRO DEL PAESAGGIO */

function centerLandscape() {

  const horizontalSpace =
    scene.scrollWidth - viewport.clientWidth;

  const verticalSpace =
    scene.scrollHeight - viewport.clientHeight;

  viewport.scrollLeft = Math.max(0, horizontalSpace / 2);
  viewport.scrollTop = Math.max(0, verticalSpace / 2);

}

window.addEventListener("load", centerLandscape);

/* APERTURA MESSAGGI */

document.querySelectorAll(".hotspot").forEach(function(link) {

  link.addEventListener("click", function(event) {

    event.preventDefault();

    noticeText.textContent = link.dataset.message;

    notice.classList.add("open");

    closeButton.focus();

  });

});

/* CHIUSURA MESSAGGI */

function closeNotice() {
  notice.classList.remove("open");
}

closeButton.addEventListener("click", closeNotice);

notice.addEventListener("click", function(event) {

  if (event.target === notice) {
    closeNotice();
  }

});

document.addEventListener("keydown", function(event) {

  if (event.key === "Escape") {
    closeNotice();
  }

});

</script>

</body>
</html>
