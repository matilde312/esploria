<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>RECUPERA PASSWORD · ESPLORIA</title><style>body{margin:0;background:#f3e7ce;color:#253f49;font:20px 'Trebuchet MS',sans-serif;line-height:1.5}main{max-width:570px;margin:6vh auto;padding:30px;background:#fff9ec;border:3px solid #ad8b61;border-radius:24px}h1{font-size:28px}label{display:block;margin-top:20px}input,button{box-sizing:border-box;width:100%;font:inherit;padding:14px;border-radius:12px;border:2px solid #a98a62}button{background:#466f67;color:white;margin-top:24px;cursor:pointer}button:disabled{opacity:.55}a{color:#315f62}#status{white-space:pre-line}[hidden]{display:none!important}@media(max-width:650px){main{margin:20px 12px;padding:22px}}</style></head><body><main><p>ESPLORIA · ACCESSO INSEGNANTI</p><h1>IMPOSTA UNA NUOVA PASSWORD</h1><p id="status" role="status" aria-live="polite">VERIFICO IL LINK…</p><form id="recovery" hidden><label for="password">NUOVA PASSWORD · ALMENO 12 CARATTERI</label><input id="password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required><label for="confirm">RIPETI LA PASSWORD</label><input id="confirm" type="password" minlength="12" maxlength="128" autocomplete="new-password" required><button id="save" type="submit">SALVA LA NUOVA PASSWORD</button></form><p id="finish" hidden>PUOI ENTRARE CON LA NUOVA PASSWORD. SE È IL TUO PRIMO ACCESSO, ESPLORIA TI CHIEDERÀ POI DI SCEGLIERE LA PASSWORD PERSONALE DEFINITIVA, DIVERSA DA QUESTA.</p><p><a href="insegnanti.html">TORNA ALL’ACCESSO INSEGNANTI →</a></p></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),url='https://eovmvcxvyhtbsxrjdmak.supabase.co',key='sb_publishable_wXXfLDRJLU3fZumfCYMHiA_qqL00eae';const params=new URLSearchParams(location.hash.slice(1));let access=params.get('access_token'),busy=false;const recovery=params.get('type')==='recovery';history.replaceState(null,'',location.pathname);params.delete('access_token');params.delete('refresh_token');
async function call(path,method,body){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),20000);try{const response=await fetch(url+path,{method,headers:{apikey:key,Authorization:'Bearer '+access,'Content-Type':'application/json'},...(body===undefined?{}:{body:JSON.stringify(body)}),signal:controller.signal});const data=await response.json().catch(()=>null);if(!response.ok){const code=data?.error_code||data?.code;if(code==='weak_password')throw Error('LA PASSWORD NON RISPETTA I REQUISITI DEL SERVIZIO. USA UNA PASSWORD PIÙ ROBUSTA.');if(code==='same_password')throw Error('SCEGLI UNA PASSWORD DIVERSA DALLA PRECEDENTE.');if(response.status===401||response.status===403)throw Error('IL LINK NON È PIÙ VALIDO. RICHIEDI UNA NUOVA EMAIL DI RECUPERO.');throw Error('SALVATAGGIO NON CONFERMATO. RIPROVA O RICHIEDI UN NUOVO LINK.')}return data}finally{clearTimeout(timer)}}
$('recovery').addEventListener('submit',async event=>{event.preventDefault();if(busy||!access)return;const password=$('password').value;if(password.length<12||password!==$('confirm').value){$('status').textContent='USA ALMENO 12 CARATTERI E RIPETI LA STESSA PASSWORD.';return}busy=true;$('save').disabled=true;try{await call('/auth/v1/user','PUT',{password});$('password').value='';$('confirm').value='';$('recovery').hidden=true;$('finish').hidden=false;$('status').textContent='NUOVA PASSWORD SALVATA.';access=null}catch(e){$('status').textContent=e.name==='AbortError'?'TEMPO SCADUTO. IL CAMBIO POTREBBE ESSERE RIUSCITO: PROVA L’ACCESSO CON LA NUOVA PASSWORD PRIMA DI RIPETERE.':e.message}finally{busy=false;$('save').disabled=false}});
(async()=>{if(!recovery||!access){access=null;$('status').textContent='APRI QUESTA PAGINA DAL LINK NELL’EMAIL DI RECUPERO. SE IL LINK È SCADUTO, RICHIEDINE UNO NUOVO.';return}try{const user=await call('/auth/v1/user','GET');if(!user?.id)throw Error('LINK NON VALIDO.');$('status').textContent='LINK VERIFICATO. SCEGLI UNA PASSWORD CHE CONOSCI SOLO TU.';$('recovery').hidden=false}catch(_){access=null;$('status').textContent='NON RIESCO A VERIFICARE IL LINK. CONTROLLA LA CONNESSIONE O RICHIEDI UN NUOVO LINK.'}})();})();
</script></body></html>
