
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ESPLORIA - IL NOSTRO MONDO</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap');

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #e4e8e0;
  font-family: 'Patrick Hand', cursive;
  color: #302d35;
}

button {
  font-family: 'Patrick Hand', cursive;
}

/* MAPPA */

#viewport {
  width: 100%;
  height: 100dvh;
  overflow: auto;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
}

#viewport::-webkit-scrollbar {
  display: none;
}

#scene {
  position: relative;
  width: max(100vw, 177.78dvh);
  aspect-ratio: 16 / 9;
}

#mapImage {
  display: block;
  width: 100%;
  height: 100%;
  user-select: none;
  -webkit-user-drag: none;
}

/* EDIFICI CLICCABILI */

.place {
  position: absolute;
  z-index: 2;
  display: block;
  border: none;
  padding: 0;
  background: transparent;
  cursor: pointer;
  border-radius: 18px;
  -webkit-tap-highlight-color: transparent;
}

.place:focus-visible {
  outline: 3px solid #c77843;
  outline-offset: 2px;
}

/* POSIZIONI DEGLI 11 LUOGHI */

#biblioteca {
  left: 9%;
  top: 19%;
  width: 15%;
  height: 22%;
}

#officina {
  left: 28%;
  top: 25%;
  width: 13%;
  height: 15%;
}

#borgo {
  left: 45%;
  top: 19%;
  width: 17%;
  height: 22%;
}

#torre {
  left: 62%;
  top: 20%;
  width: 12%;
  height: 22%;
}

#osservatorio {
  left: 83%;
  top: 19%;
  width: 15%;
  height: 20%;
}

#serra {
  left: 7%;
  top: 42%;
  width: 18%;
  height: 22%;
}

#laboratorio {
  left: 29%;
  top: 44%;
  width: 15%;
  height: 19%;
}

#porto {
  left: 52%;
  top: 45%;
  width: 14%;
  height: 19%;
}

#arti {
  left: 79%;
  top: 43%;
  width: 17%;
  height: 22%;
}

#piazza {
  left: 40%;
  top: 65%;
  width: 21%;
  height: 22%;
}

#sfide {
  left: 67%;
  top: 65%;
  width: 18%;
  height: 20%;
}

/* CASTELLO - AREA INSEGNANTI */

#castello {
  left: 69%;
  top: 4%;
  width: 16%;
  height: 18%;
  z-index: 3;
}

/* PROFILO */

#profilo {
  left: 90%;
  top: 1%;
  width: 9%;
  height: 13%;
  z-index: 4;
  border-radius: 50%;
}

/* FINESTRA ILLUSTRATA */

#overlay {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(23, 42, 55, 0.58);
}

#overlay.open {
  display: flex;
}

#dialog {
  width: min(450px, 100%);
  padding: 28px 25px;
  background: #fff0d2;
  border: 5px solid #9c744c;
  border-radius: 24px;
  box-shadow: 0 14px 45px rgba(0, 0, 0, 0.25);
  text-align: center;
}

#dialog h2 {
  margin: 0 0 14px;
  font-family: 'Patrick Hand', cursive;
  font-size: clamp(27px, 5vw, 37px);
  font-weight: 400;
  line-height: 1.1;
  text-transform: uppercase;
}

#dialog p {
  margin: 0 0 22px;
  font-family: 'Patrick Hand', cursive;
  font-size: clamp(20px, 3vw, 26px);
  line-height: 1.3;
  text-transform: uppercase;
}

/* PULSANTE ROSSO CON PATRICK HAND */

#closeDialog {
  border: 2px solid #9b5d3b;
  border-radius: 16px;
  padding: 10px 28px;

  background: #d87850;
  color: #fffaf0;

  font-family: 'Patrick Hand', cursive;
  font-size: 25px;
  font-weight: 400;
  letter-spacing: 0.5px;

  cursor: pointer;
}

#closeDialog:hover {
  background: #c96a44;
}

#closeDialog:focus-visible {
  outline: 3px solid #26394b;
  outline-offset: 3px;
}
</style>
</head>

<body>

<!-- MAPPA DI ESPLORIA -->

<main id="viewport">
  <div id="scene">

    <img
      id="mapImage"
      src="mondo-esploria.png"
      alt="MAPPA DEL MONDO DI ESPLORIA"
      draggable="false"
    >

    <button class="place" id="biblioteca"
      aria-label="BIBLIOTECA DELLE STORIE"></button>

    <button class="place" id="officina"
      aria-label="OFFICINA DELLE PAROLE"></button>

    <button class="place" id="borgo"
      aria-label="BORGO DEGLI INGRANAGGI"></button>

    <button class="place" id="torre"
      aria-label="TORRE DEL TEMPO"></button>

    <button class="place" id="osservatorio"
      aria-label="OSSERVATORIO DEI VIAGGI"></button>

    <button class="place" id="serra"
      aria-label="SERRA DELLE SCOPERTE"></button>

    <button class="place" id="laboratorio"
      aria-label="LABORATORIO DELLE INVENZIONI"></button>

    <button class="place" id="porto"
      aria-label="PORTO DELLE LINGUE"></button>

    <button class="place" id="arti"
      aria-label="CASA DELLE ARTI"></button>

    <button class="place" id="piazza"
      aria-label="PIAZZA DELLA COMUNITÀ"></button>

    <button class="place" id="sfide"
      aria-label="PADIGLIONE DELLE SFIDE"></button>

    <button class="place" id="castello"
      aria-label="AREA INSEGNANTI"></button>

    <button class="place" id="profilo"
      aria-label="IL MIO PROFILO"></button>

  </div>
</main>

<!-- FINESTRA DEL LUOGO -->

<div id="overlay"
  role="dialog"
  aria-modal="true"
  aria-labelledby="dialogTitle">

  <div id="dialog">

    <h2 id="dialogTitle"></h2>

    <p id="dialogText"></p>

    <button id="closeDialog" type="button">
      TORNA ALLA MAPPA
    </button>

  </div>
</div>

<script>

/* ELEMENTI */

const viewport = document.getElementById("viewport");
const scene = document.getElementById("scene");
const overlay = document.getElementById("overlay");

const dialogTitle =
  document.getElementById("dialogTitle");

const dialogText =
  document.getElementById("dialogText");

const closeDialog =
  document.getElementById("closeDialog");

let lastFocused = null;

/* STORIE DEI LUOGHI */

const places = {

  biblioteca: {
    title: "BIBLIOTECA DELLE STORIE",
    text:
      "TRA QUESTI SCAFFALI SI NASCONDONO " +
      "RACCONTI, SEGRETI E PERSONAGGI " +
      "STRAORDINARI. " +
      "PRESTO POTRAI SCOPRIRLI!"
  },

  officina: {
    title: "OFFICINA DELLE PAROLE",
    text:
      "IN QUESTA PICCOLA OFFICINA LE PAROLE " +
      "SI INCONTRANO, CAMBIANO FORMA E " +
      "CREANO QUALCOSA DI SPECIALE. " +
      "PRESTO POTRAI ENTRARE!"
  },

  borgo: {
    title: "BORGO DEGLI INGRANAGGI",
    text:
      "QUI OGNI INGRANAGGIO NASCONDE " +
      "UNA SFIDA E OGNI MISTERO " +
      "ASPETTA DI ESSERE RISOLTO. " +
      "PRESTO IL BORGO APRIRÀ LE SUE PORTE!"
  },

  torre: {
    title: "TORRE DEL TEMPO",
    text:
      "LE LANCETTE DI QUESTA TORRE " +
      "CUSTODISCONO SEGRETI DI EPOCHE " +
      "LONTANE. " +
      "PRESTO POTRAI VIAGGIARE NEL TEMPO!"
  },

  osservatorio: {
    title: "OSSERVATORIO DEI VIAGGI",
    text:
      "MAPPE MISTERIOSE, BUSSOLE E " +
      "SENTIERI SCONOSCIUTI TI ASPETTANO. " +
      "PRESTO POTRAI PARTIRE ALLA SCOPERTA!"
  },

  serra: {
    title: "SERRA DELLE SCOPERTE",
    text:
      "TRA FOGLIE, FIORI E PICCOLE CREATURE " +
      "SI NASCONDONO GRANDI MISTERI. " +
      "PRESTO POTRAI ESPLORARE LA SERRA!"
  },

  laboratorio: {
    title: "LABORATORIO DELLE INVENZIONI",
    text:
      "STRANI MECCANISMI E INVENZIONI " +
      "SORPRENDENTI ASPETTANO MENTI " +
      "CURIOSE. " +
      "PRESTO POTRAI METTERTI ALL'OPERA!"
  },

  porto: {
    title: "PORTO DELLE LINGUE",
    text:
      "OGNI NAVE PORTA CON SÉ PAROLE, " +
      "STORIE E MESSAGGI DA LUOGHI " +
      "LONTANI. " +
      "PRESTO POTRAI SALPARE!"
  },

  arti: {
    title: "CASA DELLE ARTI",
    text:
      "QUI COLORI, SUONI E FANTASIA " +
      "PRENDONO VITA. " +
      "PRESTO POTRAI DARE SPAZIO " +
      "ALLA TUA CREATIVITÀ!"
  },

  piazza: {
    title: "PIAZZA DELLA COMUNITÀ",
    text:
      "IN QUESTA PIAZZA OGNI VOCE " +
      "È IMPORTANTE E OGNI GESTO " +
      "PUÒ FARE LA DIFFERENZA. " +
      "PRESTO POTRAI PARTECIPARE!"
  },

  sfide: {
    title: "PADIGLIONE DELLE SFIDE",
    text:
      "DIETRO QUESTE PORTE TI ASPETTANO " +
      "GIOCHI, MISTERI E PROVE " +
      "SORPRENDENTI. " +
      "PRESTO POTRAI METTERTI ALLA PROVA!"
  },

  castello: {
    title: "AREA INSEGNANTI",
    text:
      "QUESTO CASTELLO CUSTODISCE " +
      "UNO SPAZIO RISERVATO AGLI " +
      "INSEGNANTI. " +
      "PRESTO SARÀ POSSIBILE ACCEDERVI!"
  },

  profilo: {
    title: "IL MIO PROFILO",
    text:
      "QUI POTRAI RITROVARE IL TUO " +
      "COMPAGNO DI AVVENTURA, " +
      "SCOPRIRE I TUOI PROGRESSI " +
      "E COLLEZIONARE DISTINTIVI SPECIALI. " +
      "QUESTA SEZIONE ARRIVERÀ PRESTO!"
  }

};

/* APERTURA DELLE FINESTRE */

function openPlace(button) {
  const place = places[button.id];

  if (!place) return;

  lastFocused = button;

  dialogTitle.textContent = place.title;
  dialogText.textContent = place.text;

  overlay.classList.add("open");
  closeDialog.focus();
}

/* COLLEGA GLI EDIFICI */

document.querySelectorAll(".place").forEach(button => {
  button.addEventListener("click", () => {

    if (button.id === "borgo") {
      window.location.href = "borgo.html";
      return;
    }

    openPlace(button);

  });
});
/* CHIUSURA DELLA FINESTRA */

function closePlace() {
  overlay.classList.remove("open");

  if (lastFocused) {
    lastFocused.focus();
  }
}

closeDialog.addEventListener("click", closePlace);

overlay.addEventListener("click", event => {
  if (event.target === overlay) {
    closePlace();
  }
});

document.addEventListener("keydown", event => {
  if (
    event.key === "Escape" &&
    overlay.classList.contains("open")
  ) {
    closePlace();
  }
});

/* CENTRAMENTO DELLA MAPPA */

function centerMap() {
  viewport.scrollLeft = Math.max(
    0,
    (scene.scrollWidth - viewport.clientWidth) / 2
  );

  viewport.scrollTop = Math.max(
    0,
    (scene.scrollHeight - viewport.clientHeight) / 2
  );
}

window.addEventListener("load", centerMap);
window.addEventListener("resize", centerMap);

</script>

</body>
</html>
