
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ESPLORIA - BORGO DEGLI INGRANAGGI</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap');

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
}

body {
  font-family: 'Patrick Hand', cursive;
  color: #26394b;
  background: #eee4d3;
}

button, a {
  font-family: inherit;
}

/* INTESTAZIONE DEL BORGO */

.header {
  position: relative;
  width: 100%;
}

.header img {
  display: block;
  width: 100%;
  height: auto;
}

/* PULSANTE DI RITORNO
   INCORPORATO NELL'IMMAGINE */

.back {
  position: absolute;
  left: 2%;
  top: 4%;
  width: 17%;
  height: 23%;
  background: transparent;
  border: 0;
  border-radius: 18px;
  cursor: pointer;
}

.back:focus-visible {
  outline: 3px solid #d87850;
}

/* SEZIONE ATTIVITÀ */

.activities {
  min-height: 65vh;
  padding: 45px 20px 100px;

  background-image:
    linear-gradient(
      rgba(244, 238, 224, 0.28),
      rgba(244, 238, 224, 0.28)
    ),
    url("pavimento-borgo.png");

  background-repeat: repeat;
  background-size: 500px auto;
}

/* GRIGLIA AUTOMATICA */

.activity-grid {
  width: min(1100px, 100%);
  margin: 0 auto;

  display: grid;
  grid-template-columns:
    repeat(auto-fit, minmax(min(100%, 440px), 1fr));

  gap: 35px;
  justify-content: center;
}

/* SCHEDA ILLUSTRATA */

.activity-card {
  position: relative;
  width: 100%;
  max-width: 540px;
  aspect-ratio: 3 / 2;
  margin: 0 auto;
}

.card-frame {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: fill;
}

/* CONTENUTO DELLA CORNICE */

.card-content {
  position: absolute;
  z-index: 1;

  left: 9%;
  right: 9%;
  top: 22%;
  bottom: 12%;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  text-align: center;
  gap: 7px;
}

/* ANTEPRIMA DEL GIOCO */

.game-preview {
  width: 36%;
  height: 38%;
  object-fit: contain;
}

/* TITOLO */

.game-title {
  margin: 0;
  font-size: clamp(20px, 2.5vw, 31px);
  line-height: 1;
  font-weight: 400;
}

/* DESCRIZIONE */

.game-description {
  margin: 0;
  font-size: clamp(14px, 1.7vw, 21px);
  line-height: 1.1;
}

/* PULSANTE GIOCA */

.play-button {
  margin-top: 3px;
  padding: 3px 30px;

  border: 2px solid #aa593d;
  border-radius: 30px;

  background: #d87850;
  color: white;

  font-size: clamp(19px, 2vw, 25px);
  line-height: 1.2;
  cursor: pointer;

  box-shadow: 0 3px 0 #a65c42;
}

.play-button:hover {
  background: #c96a44;
}

.play-button:focus-visible {
  outline: 3px solid #26394b;
  outline-offset: 3px;
}

/* MESSAGGIO PROVVISORIO */

#overlay {
  position: fixed;
  inset: 0;
  z-index: 20;

  display: none;
  align-items: center;
  justify-content: center;

  padding: 20px;
  background: rgba(24, 42, 57, 0.55);
}

#overlay.open {
  display: flex;
}

.dialog {
  width: min(430px, 100%);
  padding: 28px;

  background: #fff0d2;
  border: 4px solid #a77b4e;
  border-radius: 22px;

  text-align: center;
}

.dialog h2 {
  margin: 0 0 12px;
  font-size: 32px;
  font-weight: 400;
}

.dialog p {
  font-size: 23px;
  line-height: 1.25;
}

.dialog button {
  background: #d87850;
  color: white;
  border: 0;
  border-radius: 15px;
  padding: 10px 25px;
  font-size: 23px;
  cursor: pointer;
}

/* TABLET E TELEFONI */

@media (max-width: 600px) {
  .activities {
    padding: 25px 12px 70px;
    background-size: 350px auto;
  }

  .activity-grid {
    gap: 20px;
  }

  .card-content {
    gap: 4px;
  }

  .game-title {
    font-size: clamp(17px, 5vw, 25px);
  }

  .game-description {
    font-size: clamp(12px, 3.5vw, 18px);
  }

  .play-button {
    font-size: 19px;
    padding: 3px 22px;
  }
}
</style>
</head>

<body>

<!-- INTESTAZIONE ILLUSTRATA -->

<header class="header">

  <img
    src="testata-borgo.png"
    alt="BORGO DEGLI INGRANAGGI"
  >

  <a
    class="back"
    href="mondo.html"
    aria-label="TORNA ALLA MAPPA"
  ></a>

</header>

<!-- ATTIVITÀ DEL BORGO -->

<main class="activities">

  <div class="activity-grid">

    <!-- PRIMA ATTIVITÀ -->

    <article class="activity-card">

      <img
        class="card-frame"
        src="cornice-borgo.png"
        alt=""
      >

      <div class="card-content">

        <img
          class="game-preview"
          src="anteprima-forziere.png"
          alt=""
          onerror="this.style.display='none'"
        >

        <h2 class="game-title">
          IL FORZIERE SEGRETO
        </h2>

        <p class="game-description">
          SCOPRI IL CODICE NASCOSTO
          E APRI IL FORZIERE!
        </p>

        <button
          class="play-button"
          type="button"
          onclick="openGame()"
        >
          GIOCA →
        </button>

      </div>

    </article>

    <!--
      LE NUOVE ATTIVITÀ
      VERRANNO AGGIUNTE QUI.
    -->

  </div>

</main>

<!-- FINESTRA PROVVISORIA -->

<div id="overlay"
     role="dialog"
     aria-modal="true"
     aria-labelledby="dialogTitle">

  <div class="dialog">

    <h2 id="dialogTitle">
      IL FORZIERE SEGRETO
    </h2>

    <p>
      QUESTA AVVENTURA
      ARRIVERÀ PRESTO!
    </p>

    <button type="button" onclick="closeGame()">
      TORNA AL BORGO
    </button>

  </div>
</div>

<script>

const overlay = document.getElementById("overlay");

function openGame() {
  overlay.classList.add("open");
  overlay.querySelector("button").focus();
}

function closeGame() {
  overlay.classList.remove("open");
  document.querySelector(".play-button").focus();
}

document.addEventListener("keydown", function(event) {
  if (event.key === "Escape") {
    closeGame();
  }
});

overlay.addEventListener("click", function(event) {
  if (event.target === overlay) {
    closeGame();
  }
});

</script>

</body>
</html>
