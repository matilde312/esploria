
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESPLORIA - SCEGLI IL TUO COMPAGNO</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: #f6ead3;
  color: #243d4b;
}

#viewport {
  width: 100%;
  height: 100dvh;
  overflow: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}

#viewport::-webkit-scrollbar { display: none; }

#scene {
  position: relative;
  width: max(100vw, 177.68dvh);
  aspect-ratio: 1672 / 941;
}

#landscape {
  display: block;
  width: 100%;
  height: 100%;
  user-select: none;
  -webkit-user-drag: none;
}

#animals {
  position: absolute;
  inset: 0;
}

.animal {
  position: absolute;
  border: 0;
  background: transparent;
  cursor: pointer;
  border-radius: 15px;
  -webkit-tap-highlight-color: transparent;
}

.animal:focus-visible {
  outline: 3px solid #b66c3d;
  outline-offset: -3px;
}

#back {
  position: fixed;
  left: 14px;
  bottom: 14px;
  z-index: 5;
  background: #fff4dc;
  border: 2px solid #a67b51;
  border-radius: 30px;
  padding: 12px 17px;
  color: #243d4b;
  font-weight: bold;
  cursor: pointer;
  text-decoration: none;
  font-size: 13px;
}

/* FINESTRA DI PRESENTAZIONE */

#overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 20;
  background: rgba(24, 40, 48, 0.76);
  align-items: center;
  justify-content: center;
  padding: 16px;
}

#overlay.open { display: flex; }

#panel {
  background: #fff7e8;
  border: 3px solid #9d754d;
  border-radius: 22px;
  width: min(440px, 100%);
  max-height: 90dvh;
  overflow-y: auto;
  padding: 23px;
  text-align: center;
  box-shadow: 0 15px 45px #0005;
}

#panel h2 {
  margin: 4px 0 14px;
  font-size: 25px;
}

#animalPicture {
  width: min(240px, 75%);
  height: 180px;
  margin: 0 auto 12px;
  background-image: url("compagni-esploria.png");
  background-repeat: no-repeat;
  background-size: 700% 400%;
  border-radius: 15px;
}

#traits {
  color: #98633d;
  font-weight: bold;
  font-size: 13px;
  line-height: 1.6;
}

#intro {
  font-size: 16px;
  line-height: 1.6;
}

#nameInput {
  width: 100%;
  padding: 13px;
  border: 2px solid #bda381;
  border-radius: 12px;
  font-size: 18px;
  text-align: center;
  text-transform: uppercase;
}

.action {
  display: block;
  width: 100%;
  margin-top: 10px;
  padding: 13px 10px;
  border: 0;
  border-radius: 12px;
  background: #c66e50;
  color: white;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
}

.action.secondary {
  background: #e9d9bc;
  color: #243d4b;
}

#naming, #finished { display: none; }

@media (max-width: 600px) {
  #scene {
    width: max(100vw, 165dvh);
  }
}
</style>
</head>

<body>

<main id="viewport">
  <div id="scene">

    <img
      id="landscape"
      src="compagni-esploria.png"
      alt="SCEGLI IL TUO COMPAGNO DI AVVENTURA TRA 28 ANIMALI"
      draggable="false"
    >

    <div id="animals"></div>

  </div>
</main>

<a id="back" href="index.html">
  ← TORNA ALL'INIZIO
</a>

<div id="overlay" role="dialog"
     aria-modal="true" aria-labelledby="animalTitle">

  <div id="panel">

    <section id="presentation">
      <h2 id="animalTitle"></h2>
      <div id="animalPicture" role="img"></div>
      <p id="traits"></p>
      <p id="intro"></p>

      <button class="action" id="choose">
        SCEGLI IL TUO COMPAGNO
      </button>

      <button class="action secondary" id="cancel">
        TORNA INDIETRO
      </button>
    </section>

    <section id="naming">
      <h2>COME VUOI CHIAMARLO?</h2>
      <p>OGNI COMPAGNO HA BISOGNO DI UN NOME SPECIALE!</p>

      <input id="nameInput"
             type="text"
             maxlength="20"
             placeholder="SCRIVI IL NOME"
             autocomplete="off">

      <button class="action" id="confirm">
        CONFERMA
      </button>

      <button class="action secondary" id="goBack">
        TORNA INDIETRO
      </button>
    </section>

    <section id="finished">
      <h2>CHE BELLA SCELTA!</h2>
      <p id="result"></p>

      <button class="action" id="finish">
        CONTINUA L'AVVENTURA
      </button>

      <button class="action secondary" id="restart">
        SCEGLI UN ALTRO COMPAGNO
      </button>
    </section>

  </div>
</div>

<script>
const companions = [
  ["VOLPE", "CURIOSA · ASTUTA · GIOCOSA",
   "CIAO! ADORO SCOPRIRE SENTIERI NASCOSTI E LUOGHI MISTERIOSI. VUOI ESPLORARLI CON ME?"],

  ["LUPO", "LEALE · CORAGGIOSO · ATTENTO",
   "CIAO! MI PIACE CAMMINARE TRA I BOSCHI E NON LASCIO MAI SOLO UN AMICO."],

  ["CERVO", "GENTILE · CALMO · SENSIBILE",
   "CIAO! CONOSCO I SENTIERI PIÙ TRANQUILLI DEL BOSCO. TI VA DI SCOPRIRLI INSIEME?"],

  ["GUFO", "OSSERVATORE · SAGGIO · SOGNATORE",
   "CIAO! MI PIACE OSSERVARE LE STELLE E ASCOLTARE I SUONI DELLA NOTTE."],

  ["CONIGLIO", "ALLEGRO · VIVACE · AFFETTUOSO",
   "CIAO! SONO SEMPRE PRONTO A SALTELLARE VERSO UNA NUOVA AVVENTURA!"],

  ["SCOIATTOLO", "ENERGICO · CREATIVO · CURIOSO",
   "CIAO! RACCOLGO PICCOLI TESORI E HO SEMPRE MILLE IDEE PER LA TESTA."],

  ["PROCIONE", "INGEGNOSO · SIMPATICO · AVVENTUROSO",
   "CIAO! ADORO FRUGARE TRA LE COSE E SCOPRIRE OGGETTI SORPRENDENTI."],

  ["ORSO", "PROTETTIVO · DOLCE · TRANQUILLO",
   "CIAO! MI PIACCIONO LE PASSEGGIATE LENTE E LE GRANDI AVVENTURE CON GLI AMICI."],

  ["TASSO", "TENACE · PRUDENTE · FEDELE",
   "CIAO! CONOSCO TANTE GALLERIE SEGRETE SOTTO IL BOSCO."],

  ["LONTRA", "GIOCOSA · SOCIEVOLE · ALLEGRA",
   "CIAO! ADORO NUOTARE E SCIVOLARE NELL'ACQUA. VIENI CON ME?"],

  ["RICCIO", "TIMIDO · DOLCE · ATTENTO",
   "CIAO! ALL'INIZIO SONO UN PO' TIMIDO, MA CON GLI AMICI MI SENTO A CASA."],

  ["CASTORO", "OPEROSO · CREATIVO · PAZIENTE",
   "CIAO! MI PIACE COSTRUIRE RIFUGI E INVENTARE COSE NUOVE."],

  ["LINCE", "AGILE · INDIPENDENTE · CURIOSA",
   "CIAO! MI MUOVO SILENZIOSAMENTE E SCOPRO DETTAGLI CHE ALTRI NON NOTANO."],

  ["GATTO SELVATICO", "LIBERO · GIOCOSO · OSSERVATORE",
   "CIAO! AMO ARRAMPICARMI E CERCARE ANGOLI NASCOSTI."],

  ["DRAGHETTO", "FANTASIOSO · CORAGGIOSO · ALLEGRO",
   "CIAO! HO PICCOLE ALI E GRANDISSIMI SOGNI. VUOI VOLARE CON ME?"],

  ["TARTARUGA", "PAZIENTE · RIFLESSIVA · GENTILE",
   "CIAO! NON HO FRETTA: MI PIACE GODERMI OGNI SCOPERTA."],

  ["AQUILA", "AUDACE · LIBERA · ATTENTA",
   "CIAO! DALL'ALTO VEDO MONTAGNE, FIUMI E STRADE ANCORA DA ESPLORARE."],

  ["CORVO", "INGEGNOSO · CURIOSO · VIVACE",
   "CIAO! MI PIACCIONO GLI OGGETTI INSOLITI E LE SORPRESE."],

  ["FALCO", "VELOCE · DETERMINATO · OSSERVATORE",
   "CIAO! AMO IL VENTO E LE AVVENTURE TRA LE NUVOLE."],

  ["CINGHIALE", "CORAGGIOSO · TESTARDO · GENEROSO",
   "CIAO! NON MI SPAVENTO FACILMENTE E ADORO ESPLORARE IL SOTTOBOSCO."],

  ["CAPRIOLO", "DELICATO · AGILE · CURIOSO",
   "CIAO! MI PIACE CORRERE NEI PRATI E ASCOLTARE IL FRUSCIO DELLE FOGLIE."],

  ["DELFINO", "SOCIEVOLE · GIOCOSO · INTELLIGENTE",
   "CIAO! ADORO LE ONDE, I SALTI E LE AVVENTURE IN COMPAGNIA."],

  ["FOCA", "DOLCE · ALLEGRA · TRANQUILLA",
   "CIAO! MI PIACE RIPOSARE SUGLI SCOGLI E TUFFARMI NEL MARE."],

  ["PANDA", "PACIFICO · AFFETTUOSO · CURIOSO",
   "CIAO! AMO I POSTI TRANQUILLI E LE PASSEGGIATE CON GLI AMICI."],

  ["PANDA ROSSO", "VIVACE · TIMIDO · GIOCOSO",
   "CIAO! MI PIACE ARRAMPICARMI SUI RAMI E NASCONDERMI TRA LE FOGLIE."],

  ["PINGUINO", "SOCIEVOLE · TENACE · SIMPATICO",
   "CIAO! AMO SCIVOLARE SUL GHIACCIO E VIAGGIARE IN COMPAGNIA."],

  ["ORSO POLARE", "FORTE · GENTILE · CORAGGIOSO",
   "CIAO! CONOSCO DISTESE DI NEVE E PAESAGGI MERAVIGLIOSI."],

  ["VOLPE ARTICA", "INGEGNOSA · VIVACE · ATTENTA",
   "CIAO! MI PIACCIONO I PAESAGGI INNEVATI E LE PICCOLE SORPRESE."],
];

const viewport = document.getElementById("viewport");
const scene = document.getElementById("scene");
const animals = document.getElementById("animals");
const overlay = document.getElementById("overlay");

const presentation = document.getElementById("presentation");
const naming = document.getElementById("naming");
const finished = document.getElementById("finished");

let selected = -1;

/* CREA LE 28 AREE CLICCABILI */

companions.forEach((animal, index) => {
  const column = index % 7;
  const row = Math.floor(index / 7);

  const button = document.createElement("button");
  button.className = "animal";
  button.type = "button";
  button.setAttribute("aria-label", "SCEGLI " + animal[0]);

  /* POSIZIONI SULLA TAVOLA ORIGINALE */

  const centersX = [9.5, 23.1, 36.5, 50, 63.5, 77, 90.5];
  const tops = [15, 39, 59, 79];
  const heights = [23, 19, 19, 20];

  button.style.left = (centersX[column] - 6.5) + "%";
  button.style.top = tops[row] + "%";
  button.style.width = "13%";
  button.style.height = heights[row] + "%";

  button.addEventListener("click", () => showAnimal(index));

  animals.appendChild(button);
});

/* APRE LA PRESENTAZIONE */

function showAnimal(index) {
  selected = index;
  const animal = companions[index];

  document.getElementById("animalTitle").textContent = animal[0];
  document.getElementById("traits").textContent = animal[1];
  document.getElementById("intro").textContent = animal[2];

  const column = index % 7;
  const row = Math.floor(index / 7);

  const picture = document.getElementById("animalPicture");
  picture.style.backgroundPosition =
    (column * 100 / 6) + "% " + (row * 100 / 3) + "%";
  picture.setAttribute("aria-label", animal[0]);

  presentation.style.display = "block";
  naming.style.display = "none";
  finished.style.display = "none";

  overlay.classList.add("open");
  document.getElementById("choose").focus();
}

function closeOverlay() {
  overlay.classList.remove("open");
}

/* SCELTA DEL COMPAGNO */

document.getElementById("choose").onclick = () => {
  presentation.style.display = "none";
  naming.style.display = "block";
  document.getElementById("nameInput").value = "";
  document.getElementById("nameInput").focus();
};

document.getElementById("confirm").onclick = () => {
  const name = document.getElementById("nameInput").value
    .trim().toUpperCase();

  if (!name) {
    alert("SCRIVI PRIMA IL NOME DEL TUO COMPAGNO!");
    return;
  }

  /* SALVATAGGIO LOCALE DI PROVA */
  const companion = {
    animal: companions[selected][0],
    index: selected,
    name: name
  };

  localStorage.setItem(
    "esploria-compagno-prova",
    JSON.stringify(companion)
  );

  document.getElementById("result").textContent =
    name + " È IL TUO NUOVO COMPAGNO DI AVVENTURA!";

  naming.style.display = "none";
  finished.style.display = "block";
};

document.getElementById("cancel").onclick = closeOverlay;

document.getElementById("goBack").onclick = () => {
  naming.style.display = "none";
  presentation.style.display = "block";
};

document.getElementById("restart").onclick = closeOverlay;

document.getElementById("finish").onclick = () => {
  alert("PRESTO POTRAI ENTRARE NEL MONDO DI ESPLORIA!");
  closeOverlay();
};

overlay.addEventListener("click", event => {
  if (event.target === overlay) closeOverlay();
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape") closeOverlay();
});

/* CENTRAMENTO DEL PAESAGGIO */

function centerScene() {
  viewport.scrollLeft = Math.max(
    0, (scene.scrollWidth - viewport.clientWidth) / 2
  );
  viewport.scrollTop = Math.max(
    0, (scene.scrollHeight - viewport.clientHeight) / 2
  );
}

window.addEventListener("load", centerScene);
window.addEventListener("resize", centerScene);
</script>

</body>
</html>
