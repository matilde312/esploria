<!DOCTYPE html>
<html lang="it">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Esploria — Inizia l'avventura</title>

<style>

/* IMPOSTAZIONI GENERALI */

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: #dce9e0;
}

/* CONTENITORE DEL PAESAGGIO */

.page {
  position: relative;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  overflow: auto;
  cursor: grab;
  scrollbar-width: thin;
  scrollbar-color: #8b9b8b transparent;
  overscroll-behavior: contain;
}

.page.dragging {
  cursor: grabbing;
  user-select: none;
}

/* IMMAGINE PRINCIPALE */

.scene {
  position: relative;

  width: max(100vw, 1536px);
  height: auto;
  aspect-ratio: 3 / 2;

  background-image: url("sfondo-esploria.png");
  background-size: 100% 100%;
  background-position: center;
  background-repeat: no-repeat;

  overflow: hidden;
}

/* PULSANTI INVISIBILI SOPRA L'IMMAGINE */

.hotspot {
  position: absolute;
  display: block;
  cursor: pointer;

  border: none;
  background: transparent;
  border-radius: 30px;

  text-decoration: none;
  outline-offset: 4px;

  transition: filter 0.2s ease;
}

/* NESSUN CONTORNO DOPPIO */

.hotspot:hover {
  filter: brightness(1.08);
}

.hotspot:focus-visible {
  outline: 3px solid white;
}

/* INIZIA L'AVVENTURA */

.start {
  left: 36.7%;
  top: 41.3%;
  width: 28.7%;
  height: 9.5%;
}

/* RITROVA IL PERSONAGGIO */

.recover {
  left: 38%;
  top: 52.4%;
  width: 25.3%;
  height: 7.2%;
}

/* AREA INSEGNANTI */

.teacher {
  left: 84.5%;
  top: 2.3%;
  width: 12%;
  height: 8.1%;
}

/* FINESTRA DEI MESSAGGI */

.notice {
  position: fixed;
  inset: 0;

  display: none;
  align-items: center;
  justify-content: center;

  background: rgba(20, 40, 50, 0.75);
  padding: 20px;
  z-index: 100;
}

.notice.open {
  display: flex;
}

.card {
  width: min(420px, 100%);
  background: #fff8e7;

  border: 3px solid #775b3e;
  border-radius: 22px;

  padding: 30px;
  text-align: center;

  color: #263b44;

  box-shadow: 0 12px 35px rgba(0,0,0,0.3);
}

.card h2 {
  margin-top: 0;
  font-size: 26px;
}

.card p {
  font-size: 18px;
  line-height: 1.5;
}

.card button {
  background: #c66e50;
  color: white;

  border: none;
  border-radius: 12px;

  padding: 13px 30px;
  font-size: 17px;
  font-weight: bold;

  cursor: pointer;
}

.card button:hover {
  background: #a9543a;
}

</style>
</head>

<body>

<main class="page" id="page">

  <div class="scene" id="scene">

    <!-- PULSANTE INIZIA -->

    <a
      class="hotspot start"
      href="#inizia"
      aria-label="Inizia l'avventura"
      data-message="Presto potrai creare il tuo personaggio e iniziare a esplorare Esploria!">
    </a>

    <!-- PULSANTE RITROVA PERSONAGGIO -->

    <a
      class="hotspot recover"
      href="#ritrova"
      aria-label="Ritrova il tuo personaggio"
      data-message="Qui potrai recuperare il tuo personaggio e continuare le tue avventure.">
    </a>

    <!-- AREA INSEGNANTI -->

    <a
      class="hotspot teacher"
      href="#insegnanti"
      aria-label="Area insegnanti"
      data-message="Qui realizzeremo l'area riservata agli insegnanti.">
    </a>

  </div>

</main>

<!-- FINESTRA INFORMATIVA -->

<div class="notice" id="notice" role="dialog"
     aria-modal="true" aria-labelledby="notice-title">

  <div class="card">

    <h2 id="notice-title">
      Esploria è in costruzione 🌿
    </h2>

    <p id="notice-text"></p>

    <button id="close" type="button">
      CHIUDI
    </button>

  </div>

</div>

<script>

/* ELEMENTI PRINCIPALI */

const page = document.getElementById("page");
const scene = document.getElementById("scene");

const notice = document.getElementById("notice");
const closeButton = document.getElementById("close");
const noticeText = document.getElementById("notice-text");

/* POSIZIONE INIZIALE DEL PAESAGGIO */

function centerScene() {

  page.scrollLeft =
    Math.max(0, (scene.scrollWidth - page.clientWidth) / 2);

  page.scrollTop =
    Math.max(0, (scene.scrollHeight - page.clientHeight) / 2);

}

window.addEventListener("load", centerScene);

/* TRASCINAMENTO DEL PAESAGGIO */

let dragging = false;

let startX = 0;
let startY = 0;

let initialScrollLeft = 0;
let initialScrollTop = 0;

let moved = false;

page.addEventListener("pointerdown", function(event) {

  if (event.pointerType === "mouse" && event.button !== 0) {
    return;
  }

  if (event.target.closest(".hotspot")) {
    return;
  }

  dragging = true;
  moved = false;

  startX = event.clientX;
  startY = event.clientY;

  initialScrollLeft = page.scrollLeft;
  initialScrollTop = page.scrollTop;

  page.classList.add("dragging");

  page.setPointerCapture(event.pointerId);

});

page.addEventListener("pointermove", function(event) {

  if (!dragging) return;

  const deltaX = event.clientX - startX;
  const deltaY = event.clientY - startY;

  if (Math.abs(deltaX) > 3 || Math.abs(deltaY) > 3) {
    moved = true;
  }

  page.scrollLeft = initialScrollLeft - deltaX;
  page.scrollTop = initialScrollTop - deltaY;

});

function stopDragging() {
  dragging = false;
  page.classList.remove("dragging");
}

page.addEventListener("pointerup", stopDragging);
page.addEventListener("pointercancel", stopDragging);

/* FUNZIONAMENTO PULSANTI */

document.querySelectorAll("[data-message]").forEach(function(link) {

  link.addEventListener("click", function(event) {

    event.preventDefault();

    noticeText.textContent = link.dataset.message;

    notice.classList.add("open");

    closeButton.focus();

  });

});

/* CHIUSURA FINESTRA */

function closeNotice() {
  notice.classList.remove("open");
}

closeButton.addEventListener("click", closeNotice);

notice.addEventListener("click", function(event) {

  if (event.target === notice) {
    closeNotice();
  }

});

document.addEventListener("keydown", function(event) {

  if (event.key === "Escape") {
    closeNotice();
  }

});

</script>

</body>
</html>
