
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESPLORIA - SCEGLI IL TUO COMPAGNO</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: #f6ead3;
  color: #243d4b;
}

button, input {
  font: inherit;
}

/* GALLERIA ORIGINALE */

#viewport {
  width: 100%;
  height: 100dvh;
  overflow: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}

#viewport::-webkit-scrollbar {
  display: none;
}

#scene {
  position: relative;
  width: max(100vw, 177.68dvh);
  aspect-ratio: 1672 / 941;
}

#landscape {
  display: block;
  width: 100%;
  height: 100%;
  user-select: none;
  -webkit-user-drag: none;
}

#animals {
  position: absolute;
  inset: 0;
}

.animal, #back {
  position: absolute;
  border: 0;
  background: transparent;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.animal {
  border-radius: 15px;
}

#back {
  z-index: 5;
  left: 3%;
  top: 2%;
  width: 17%;
  height: 12%;
  border-radius: 20px;
}

/* SCHERMATE ILLUSTRATE */

.overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 20;
  background: rgba(18, 35, 48, 0.82);
  align-items: center;
  justify-content: center;
  padding: 8px;
}

.overlay.open {
  display: flex;
}

#nameOverlay {
  z-index: 30;
}

.illustratedPanel {
  position: relative;
  width: min(100%, 150dvh);
  max-height: calc(100dvh - 16px);
  aspect-ratio: 3 / 2;
}

.illustratedPanel img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  user-select: none;
  -webkit-user-drag: none;
}

.hotspot {
  position: absolute;
  border: 0;
  background: transparent;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.animal:focus-visible,
#back:focus-visible,
.hotspot:focus-visible,
#nameInput:focus-visible {
  outline: 3px solid #b66c3d;
  outline-offset: -3px;
}

/* PULSANTI DELLE 28 SCHEDE */

#closeCard {
  top: 3%;
  right: 7%;
  width: 7%;
  height: 13%;
  border-radius: 50%;
}

#returnAnimals {
  left: 11%;
  bottom: 5%;
  width: 28%;
  height: 16%;
  border-radius: 30px;
}

#chooseCompanion {
  left: 43%;
  bottom: 4%;
  width: 41%;
  height: 19%;
  border-radius: 30px;
}

/* SCHERMATA NOME COMPAGNO */

#nameInput {
  position: absolute;

  /* Riquadro vuoto della pergamena */
  left: 34%;
  top: 52.5%;
  width: 32%;
  height: 8%;

  padding: 0 8px;
  border: 0;
  outline: none;
  background: #f5e7c9;
  border-radius: 12px;

  color: #344c5b;
  font-size: clamp(12px, 2.1vw, 25px);
  font-weight: bold;
  text-align: center;
  text-transform: uppercase;
}

#nameBack {
  left: 25%;
  top: 67%;
  width: 23%;
  height: 14%;
  border-radius: 25px;
}

#nameConfirm {
  left: 52%;
  top: 67%;
  width: 23%;
  height: 14%;
  border-radius: 25px;
}

#nameClose {
  top: 3%;
  right: 8%;
  width: 7%;
  height: 12%;
  border-radius: 50%;
}

#errorMessage {
  display: none;
  position: absolute;
  left: 25%;
  top: 61%;
  width: 50%;
  margin: 0;
  padding: 4px;
  background: #fff5e5;
  border-radius: 8px;
  color: #a04435;
  font-size: clamp(9px, 1.2vw, 15px);
  font-weight: bold;
  text-align: center;
}

@media (max-width: 600px) {
  #scene {
    width: max(100vw, 165dvh);
  }

  #nameInput {
    font-size: clamp(10px, 3vw, 17px);
    padding: 0 3px;
  }
}
</style>
</head>

<body>

<!-- GALLERIA DEI 28 ANIMALI -->

<main id="viewport">
  <div id="scene">

    <img
      id="landscape"
      src="compagni-esploria.png"
      alt="SCEGLI IL TUO COMPAGNO TRA 28 ANIMALI"
      draggable="false"
    >

    <div id="animals"></div>

    <a
      id="back"
      href="accesso.html"
      aria-label="TORNA INDIETRO"
      title="TORNA INDIETRO"
    ></a>

  </div>
</main>

<!-- SCHEDA DELL'ANIMALE -->

<div
  id="cardOverlay"
  class="overlay"
  role="dialog"
  aria-modal="true"
  aria-label="SCHEDA DEL COMPAGNO"
>

  <div class="illustratedPanel">

    <img id="cardImage" src="" alt="">

    <button
      id="closeCard"
      class="hotspot"
      type="button"
      aria-label="CHIUDI LA SCHEDA"
    ></button>

    <button
      id="returnAnimals"
      class="hotspot"
      type="button"
      aria-label="TORNA AGLI ANIMALI"
    ></button>

    <button
      id="chooseCompanion"
      class="hotspot"
      type="button"
      aria-label="SCEGLI QUESTO COMPAGNO"
    ></button>

  </div>
</div>

<!-- NUOVA SCHERMATA ILLUSTRATA DEL NOME -->

<div
  id="nameOverlay"
  class="overlay"
  role="dialog"
  aria-modal="true"
  aria-label="COME SI CHIAMA IL TUO COMPAGNO?"
>

  <div class="illustratedPanel">

    <img
      src="nome-compagno.png"
      alt="COME SI CHIAMA IL TUO COMPAGNO? SCEGLI UN NOME SPECIALE PER IL TUO COMPAGNO DI AVVENTURA!"
      draggable="false"
    >

    <input
      id="nameInput"
      type="text"
      maxlength="20"
      aria-label="SCRIVI IL NOME DEL COMPAGNO"
      autocomplete="off"
      spellcheck="false"
    >

    <p id="errorMessage" role="alert">
      SCRIVI PRIMA UN NOME!
    </p>

    <button
      id="nameBack"
      class="hotspot"
      type="button"
      aria-label="TORNA INDIETRO"
    ></button>

    <button
      id="nameConfirm"
      class="hotspot"
      type="button"
      aria-label="CONFERMA IL NOME"
    ></button>

    <button
      id="nameClose"
      class="hotspot"
      type="button"
      aria-label="CHIUDI"
    ></button>

  </div>
</div>

<script>

/* I 28 COMPAGNI, NELL'ORDINE ORIGINALE */

const companions = [
  ["VOLPE", "volpe"],
  ["LUPO", "lupo"],
  ["CERVO", "cervo"],
  ["GUFO", "gufo"],
  ["CONIGLIO", "coniglio"],
  ["SCOIATTOLO", "scoiattolo"],
  ["PROCIONE", "procione"],

  ["ORSO", "orso"],
  ["TASSO", "tasso"],
  ["LONTRA", "lontra"],
  ["RICCIO", "riccio"],
  ["CASTORO", "castoro"],
  ["LINCE", "lince"],
  ["GATTO SELVATICO", "gatto-selvatico"],

  ["DRAGHETTO", "draghetto"],
  ["TARTARUGA", "tartaruga"],
  ["AQUILA", "aquila"],
  ["CORVO", "corvo"],
  ["FALCO", "falco"],
  ["CINGHIALE", "cinghiale"],
  ["CAPRIOLO", "capriolo"],

  ["DELFINO", "delfino"],
  ["FOCA", "foca"],
  ["PANDA", "panda"],
  ["PANDA ROSSO", "panda-rosso"],
  ["PINGUINO", "pinguino"],
  ["ORSO POLARE", "orso-polare"],
  ["VOLPE ARTICA", "volpe-artica"]
];

const viewport = document.getElementById("viewport");
const scene = document.getElementById("scene");
const animals = document.getElementById("animals");

const cardOverlay = document.getElementById("cardOverlay");
const cardImage = document.getElementById("cardImage");

const nameOverlay = document.getElementById("nameOverlay");
const nameInput = document.getElementById("nameInput");
const errorMessage = document.getElementById("errorMessage");

let selected = -1;

/* CREA LE 28 AREE CLICCABILI */

const centersX = [9.5, 23.1, 36.5, 50, 63.5, 77, 90.5];
const tops = [15, 39, 59, 79];
const heights = [23, 19, 19, 20];

companions.forEach((animal, index) => {
  const column = index % 7;
  const row = Math.floor(index / 7);

  const button = document.createElement("button");

  button.className = "animal";
  button.type = "button";
  button.setAttribute("aria-label", "SCOPRI " + animal[0]);

  button.style.left = (centersX[column] - 6.5) + "%";
  button.style.top = tops[row] + "%";
  button.style.width = "13%";
  button.style.height = heights[row] + "%";

  button.addEventListener("click", () => {
    showAnimal(index);
  });

  animals.appendChild(button);
});

/* APRE LA SCHEDA DELL'ANIMALE */

function showAnimal(index) {
  selected = index;

  const animal = companions[index];

  cardImage.src =
    "schede/scheda-" + animal[1] + ".png";

  cardImage.alt =
    "SCHEDA DEL COMPAGNO " + animal[0];

  cardOverlay.classList.add("open");

  document.getElementById("closeCard").focus();
}

function closeCard() {
  cardOverlay.classList.remove("open");
}

document.getElementById("closeCard").onclick = closeCard;
document.getElementById("returnAnimals").onclick = closeCard;

/* APRE LA NUOVA SCHERMATA DEL NOME */

function openNameScreen() {
  if (selected < 0) return;

  cardOverlay.classList.remove("open");
  nameOverlay.classList.add("open");

  nameInput.value = "";
  errorMessage.style.display = "none";

  nameInput.focus();
}

document.getElementById("chooseCompanion").onclick =
  openNameScreen;

/* TORNA ALLA SCHEDA PRECEDENTE */

function returnToCard() {
  nameOverlay.classList.remove("open");
  cardOverlay.classList.add("open");

  document.getElementById("chooseCompanion").focus();
}

document.getElementById("nameBack").onclick = returnToCard;
document.getElementById("nameClose").onclick = returnToCard;

/* CONFERMA IL NOME */

function confirmCompanion() {
  if (selected < 0) return;

  const name = nameInput.value.trim().toUpperCase();

  if (!name) {
    errorMessage.style.display = "block";
    nameInput.focus();
    return;
  }

  errorMessage.style.display = "none";

  const companion = {
    animal: companions[selected][0],
    index: selected,
    name: name
  };

  try {
    localStorage.setItem(
      "esploria-compagno-prova",
      JSON.stringify(companion)
    );
  } catch (error) {
    console.warn(
      "SALVATAGGIO LOCALE NON DISPONIBILE",
      error
    );
  }

  nameOverlay.classList.remove("open");

  /* COLLEGAMENTO FUTURO AL MONDO DI ESPLORIA */

  alert(
    "HAI SCELTO " + companion.animal +
    " E LO HAI CHIAMATO " + name +
    "! IL MONDO DI ESPLORIA SARÀ PRESTO PRONTO!"
  );
}

document.getElementById("nameConfirm").onclick =
  confirmCompanion;

nameInput.addEventListener("keydown", event => {
  if (event.key === "Enter") {
    confirmCompanion();
  }
});

/* CHIUSURA CON ESC */

document.addEventListener("keydown", event => {
  if (event.key !== "Escape") return;

  if (nameOverlay.classList.contains("open")) {
    returnToCard();
  } else if (cardOverlay.classList.contains("open")) {
    closeCard();
  }
});

/* CENTRAMENTO DELLA GALLERIA */

function centerScene() {
  viewport.scrollLeft = Math.max(
    0,
    (scene.scrollWidth - viewport.clientWidth) / 2
  );

  viewport.scrollTop = Math.max(
    0,
    (scene.scrollHeight - viewport.clientHeight) / 2
  );
}

window.addEventListener("load", centerScene);
window.addEventListener("resize", centerScene);

</script>

</body>
</html>
