<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Esploria</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f0ff;
      text-align: center;
      padding: 50px 20px;
    }

    h1 {
      color: #7255a5;
      font-size: 42px;
    }

    p {
      font-size: 20px;
      color: #444;
    }

    button {
      background-color: #7255a5;
      color: white;
      border: none;
      border-radius: 15px;
      padding: 15px 30px;
      font-size: 20px;
      cursor: pointer;
      margin-top: 20px;
    }

    button:hover {
      background-color: #584080;
    }
  </style>
</head>

<body>

  <h1>🌍 BENVENUTO A ESPLORIA!</h1>

  <p>Un mondo di giochi, scoperte e avventure ti aspetta!</p>

  <button onclick="alert('Le avventure stanno arrivando!')">
    INIZIA L'AVVENTURA
  </button>

</body>
</html>
